<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced 3D Highway Noise Simulation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #5ab2e6;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        /* Modernized UI Panel */
        #ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 320px;
            pointer-events: auto;
            color: #f1f5f9;
        }
        h2 { margin-top: 0; font-size: 1.3rem; color: #38bdf8; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .control-group { margin-bottom: 18px; }
        label {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-weight: 600;
            font-size: 1.05rem;
        }
        input[type="checkbox"] { margin-right: 12px; width: 20px; height: 20px; accent-color: #38bdf8; cursor: pointer;}
        
        .meter-container {
            width: 100%;
            background-color: #334155;
            border-radius: 8px;
            overflow: hidden;
            height: 28px;
            margin-top: 8px;
            border: 1px solid #0f172a;
        }
        #noise-bar {
            height: 100%;
            width: 100%;
            background-color: #ef4444;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.5s ease;
        }
        .stats {
            margin-top: 6px;
            font-size: 0.85rem;
            color: #94a3b8;
            padding-left: 32px;
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
            text-shadow: 0px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
        }
    </style>
    <!-- Load Three.js and OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="ui-panel">
        <h2>Noise Mitigation Controls</h2>
        
        <div class="control-group">
            <label>
                <input type="checkbox" id="toggle-wall">
                Construct Sound Barrier
            </label>
            <div class="stats">Blocks direct acoustic waves (-20 dB)</div>
        </div>

        <div class="control-group">
            <label>
                <input type="checkbox" id="toggle-trees">
                Plant Pine Buffer Zone
            </label>
            <div class="stats">Scatters high frequencies (-10 dB)</div>
        </div>

        <div class="control-group">
            <label>
                <input type="checkbox" id="toggle-speed">
                Enforce Speed Limits
            </label>
            <div class="stats">Reduces tire & engine roar (-15 dB)</div>
        </div>

        <div style="margin-top: 30px; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px;">
            <strong>Volume at Residence: <span id="noise-value" style="color: #38bdf8; font-size: 1.2rem;">85</span> dB</strong>
            <div class="meter-container">
                <div id="noise-bar"></div>
            </div>
            <div id="noise-status" style="margin-top: 10px; color: #ef4444; font-weight: bold; text-align: center;">Harmful Environment</div>
        </div>
    </div>

    <div id="instructions">🖱️ Left Click + Drag to Rotate | 🖱️ Right Click to Pan | 🖱️ Scroll to Zoom</div>

    <div id="canvas-container"></div>

    <script>
        // --- 1. Basic Setup & High-End Renderer ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x5ab2e6); // Richer sky blue
        scene.fog = new THREE.FogExp2(0x5ab2e6, 0.008); // Better depth fog

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(-30, 25, 45); // Better starting angle

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap; // Soft, realistic shadows
        renderer.outputEncoding = THREE.sRGBEncoding; // Accurate colors
        renderer.toneMapping = THREE.ACESFilmicToneMapping; // Cinematic lighting
        renderer.toneMappingExposure = 1.0;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // --- 2. Camera Controls ---
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.02; // Prevent going beneath ground
        controls.minDistance = 10;
        controls.maxDistance = 150;
        controls.target.set(0, 0, 5); // Look slightly towards the house

        // --- 3. Enhanced Lighting ---
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
        hemiLight.position.set(0, 50, 0);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xfffaed, 1.2); // Warm sunlight
        dirLight.position.set(40, 60, -20);
        dirLight.castShadow = true;
        // High-res shadows
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.left = -50;
        dirLight.shadow.camera.right = 50;
        dirLight.shadow.camera.top = 50;
        dirLight.shadow.camera.bottom = -50;
        dirLight.shadow.bias = -0.0005; // Prevent shadow acne
        scene.add(dirLight);

        // --- 4. Detailed Environment ---
        // Lush Ground
        const groundGeo = new THREE.PlaneGeometry(200, 200);
        const groundMat = new THREE.MeshStandardMaterial({ 
            color: 0x477a33, 
            roughness: 0.9, 
            metalness: 0.1 
        });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Detailed Highway
        const roadGroup = new THREE.Group();
        roadGroup.position.set(0, 0.1, -10);
        
        // Main Asphalt
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.7 });
        const road = new THREE.Mesh(new THREE.PlaneGeometry(200, 14), roadMat);
        road.rotation.x = -Math.PI / 2;
        road.receiveShadow = true;
        roadGroup.add(road);

        // Center dashed yellow line
        for(let i = -100; i < 100; i += 6) {
            const line = new THREE.Mesh(new THREE.PlaneGeometry(3, 0.3), new THREE.MeshBasicMaterial({ color: 0xffcc00 }));
            line.rotation.x = -Math.PI / 2;
            line.position.set(i, 0.02, 0);
            roadGroup.add(line);
        }

        // Solid white edge lines
        const edgeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const edge1 = new THREE.Mesh(new THREE.PlaneGeometry(200, 0.3), edgeMat);
        edge1.rotation.x = -Math.PI / 2;
        edge1.position.set(0, 0.02, -6);
        roadGroup.add(edge1);
        
        const edge2 = edge1.clone();
        edge2.position.set(0, 0.02, 6);
        roadGroup.add(edge2);

        scene.add(roadGroup);

        // Detailed House
        const houseGroup = new THREE.Group();
        houseGroup.position.set(0, 0, 18);
        
        // Main body
        const base = new THREE.Mesh(
            new THREE.BoxGeometry(8, 5, 6),
            new THREE.MeshStandardMaterial({ color: 0xeaeaea, roughness: 0.8 })
        );
        base.position.y = 2.5;
        base.castShadow = true;
        base.receiveShadow = true;
        houseGroup.add(base);

        // Roof
        const roof = new THREE.Mesh(
            new THREE.ConeGeometry(6.5, 3.5, 4),
            new THREE.MeshStandardMaterial({ color: 0x3d3d3d, roughness: 0.9 })
        );
        roof.position.y = 6.75;
        roof.rotation.y = Math.PI / 4;
        roof.castShadow = true;
        houseGroup.add(roof);

        // Door
        const door = new THREE.Mesh(
            new THREE.BoxGeometry(1.5, 3, 0.2),
            new THREE.MeshStandardMaterial({ color: 0x5c4033, roughness: 0.7 })
        );
        door.position.set(0, 1.5, -3.01);
        houseGroup.add(door);

        // Windows (Glowing)
        const windowMat = new THREE.MeshStandardMaterial({ color: 0xffeebb, emissive: 0xaa8822, roughness: 0.1 });
        const win1 = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 1.5), windowMat);
        win1.position.set(-2.5, 2.5, -3.01);
        win1.rotation.y = Math.PI;
        houseGroup.add(win1);
        
        const win2 = win1.clone();
        win2.position.set(2.5, 2.5, -3.01);
        houseGroup.add(win2);

        // Chimney
        const chimney = new THREE.Mesh(
            new THREE.BoxGeometry(1, 4, 1),
            new THREE.MeshStandardMaterial({ color: 0x8b3a3a })
        );
        chimney.position.set(-2.5, 6, 1);
        chimney.castShadow = true;
        houseGroup.add(chimney);

        scene.add(houseGroup);

        // --- 5. Mitigation Objects (Detailed) ---
        // Concrete Sound Wall
        const wallGroup = new THREE.Group();
        wallGroup.position.set(0, 0, -2);
        wallGroup.visible = false;

        const wallMat = new THREE.MeshStandardMaterial({ color: 0x88929e, roughness: 0.9 });
        for(let i = -60; i <= 60; i += 4) {
            const panel = new THREE.Mesh(new THREE.BoxGeometry(3.9, 6, 0.8), wallMat);
            panel.position.set(i, 3, 0);
            panel.castShadow = true;
            panel.receiveShadow = true;
            wallGroup.add(panel);
            
            // Pillar
            const pillar = new THREE.Mesh(new THREE.BoxGeometry(0.5, 6.2, 1.2), new THREE.MeshStandardMaterial({ color: 0x64748b }));
            pillar.position.set(i + 2, 3.1, 0);
            pillar.castShadow = true;
            wallGroup.add(pillar);
        }
        scene.add(wallGroup);

        // Pine Trees
        const treesGroup = new THREE.Group();
        treesGroup.visible = false;
        
        function createPineTree(x, z) {
            const tree = new THREE.Group();
            
            const trunk = new THREE.Mesh(
                new THREE.CylinderGeometry(0.3, 0.4, 2),
                new THREE.MeshStandardMaterial({ color: 0x4a3b2c, roughness: 1 })
            );
            trunk.position.y = 1;
            trunk.castShadow = true;
            tree.add(trunk);

            const leafMat = new THREE.MeshStandardMaterial({ color: 0x2d5a27, roughness: 0.8 });
            
            const leaves1 = new THREE.Mesh(new THREE.ConeGeometry(2, 3, 8), leafMat);
            leaves1.position.y = 2.5;
            leaves1.castShadow = true;
            tree.add(leaves1);

            const leaves2 = new THREE.Mesh(new THREE.ConeGeometry(1.5, 2.5, 8), leafMat);
            leaves2.position.y = 4;
            leaves2.castShadow = true;
            tree.add(leaves2);

            const leaves3 = new THREE.Mesh(new THREE.ConeGeometry(1, 2, 8), leafMat);
            leaves3.position.y = 5.5;
            leaves3.castShadow = true;
            tree.add(leaves3);

            tree.position.set(x, 0, z);
            
            // Randomize size slightly
            const scale = 0.8 + Math.random() * 0.5;
            tree.scale.set(scale, scale, scale);
            
            return tree;
        }

        // Plant a thick buffer zone
        for (let i = -40; i <= 40; i += 6) {
            treesGroup.add(createPineTree(i + (Math.random()*2), 3 + (Math.random()*2)));
            treesGroup.add(createPineTree(i + 3 + (Math.random()*2), 6 + (Math.random()*2)));
        }
        scene.add(treesGroup);

        // --- 6. Advanced Traffic System ---
        const cars = [];
        const carColors = [0xb91d47, 0x1d47b9, 0xeeeeee, 0x2b572a, 0xe3a21a, 0x111111];

        const wheelGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.4, 16);
        const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });
        const glassMat = new THREE.MeshStandardMaterial({ color: 0x111122, roughness: 0.1, metalness: 0.8 });

        function createDetailedCar(zPos, direction) {
            const carGroup = new THREE.Group();
            const paintColor = carColors[Math.floor(Math.random() * carColors.length)];
            const bodyMat = new THREE.MeshStandardMaterial({ color: paintColor, roughness: 0.2, metalness: 0.6 });

            // Lower body
            const body = new THREE.Mesh(new THREE.BoxGeometry(4.5, 1, 2), bodyMat);
            body.position.y = 0.9;
            body.castShadow = true;
            carGroup.add(body);

            // Cabin / Glass
            const cabin = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.8, 1.8), glassMat);
            cabin.position.set((direction === 1 ? -0.5 : 0.5), 1.8, 0); // Cabin shifted back
            cabin.castShadow = true;
            carGroup.add(cabin);

            // Wheels
            const wheelPositions = [
                [-1.5, 0.5, 1], [1.5, 0.5, 1],
                [-1.5, 0.5, -1], [1.5, 0.5, -1]
            ];
            wheelPositions.forEach(pos => {
                const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.rotation.x = Math.PI / 2;
                wheel.position.set(...pos);
                wheel.castShadow = true;
                carGroup.add(wheel);
            });

            // Headlights
            const headLightMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff });
            const tailLightMat = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0xaa0000 });
            
            const hl1 = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.3, 0.4), headLightMat);
            hl1.position.set(direction === 1 ? 2.25 : -2.25, 1, 0.7);
            carGroup.add(hl1);
            
            const hl2 = hl1.clone();
            hl2.position.set(direction === 1 ? 2.25 : -2.25, 1, -0.7);
            carGroup.add(hl2);

            const tl1 = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.3, 0.4), tailLightMat);
            tl1.position.set(direction === 1 ? -2.25 : 2.25, 1, 0.7);
            carGroup.add(tl1);

            const tl2 = tl1.clone();
            tl2.position.set(direction === 1 ? -2.25 : 2.25, 1, -0.7);
            carGroup.add(tl2);

            carGroup.position.set(direction * 80, 0, zPos);
            scene.add(carGroup);
            
            cars.push({ 
                mesh: carGroup, 
                direction: direction, 
                baseSpeed: 0.6 + Math.random() * 0.3 
            });
        }

        // Spawn cars
        for(let i=0; i<4; i++) createDetailedCar(-13, 1);  // Eastbound
        for(let i=0; i<4; i++) createDetailedCar(-7, -1); // Westbound

        // Randomize initial positions
        cars.forEach(car => car.mesh.position.x = (Math.random() - 0.5) * 160);

        // --- 7. Upgraded Noise Visualizer (Forcefield effect) ---
        const auraGeo = new THREE.SphereGeometry(9, 64, 64);
        const auraMat = new THREE.MeshStandardMaterial({ 
            color: 0xff0000, 
            transparent: true, 
            opacity: 0.2,
            wireframe: true,
            emissive: 0xff0000,
            emissiveIntensity: 0.5
        });
        const noiseAura = new THREE.Mesh(auraGeo, auraMat);
        noiseAura.position.copy(houseGroup.position);
        noiseAura.position.y += 2;
        scene.add(noiseAura);

        // --- 8. Simulation Logic ---
        let currentNoise = 85; 
        let speedMultiplier = 1;
        let houseShakeAmount = 0.1;

        const wallCheck = document.getElementById('toggle-wall');
        const treesCheck = document.getElementById('toggle-trees');
        const speedCheck = document.getElementById('toggle-speed');
        const noiseValue = document.getElementById('noise-value');
        const noiseBar = document.getElementById('noise-bar');
        const noiseStatus = document.getElementById('noise-status');

        function updateSimulationState() {
            let noise = 85; 
            speedMultiplier = 1;

            if (speedCheck.checked) {
                noise -= 15;
                speedMultiplier = 0.35; // Slow down cars
            }
            if (wallCheck.checked) {
                noise -= 20;
                wallGroup.visible = true;
            } else {
                wallGroup.visible = false;
            }
            if (treesCheck.checked) {
                noise -= 10;
                treesGroup.visible = true;
            } else {
                treesGroup.visible = false;
            }

            currentNoise = noise;
            noiseValue.innerText = currentNoise;
            
            let percentage = ((currentNoise - 40) / 50) * 100;
            percentage = Math.max(0, Math.min(100, percentage));
            noiseBar.style.width = percentage + "%";

            // Update UI & Aura Colors
            if (currentNoise >= 75) {
                noiseBar.style.backgroundColor = "#ef4444"; // Red
                noiseStatus.innerText = "Harmful - Disturbs Sleep & Health";
                noiseStatus.style.color = "#ef4444";
                auraMat.color.setHex(0xff0000); 
                auraMat.emissive.setHex(0xff0000);
                houseShakeAmount = 0.08;
            } else if (currentNoise >= 55) {
                noiseBar.style.backgroundColor = "#f59e0b"; // Orange
                noiseStatus.innerText = "Moderate - Annoying Background";
                noiseStatus.style.color = "#f59e0b";
                auraMat.color.setHex(0xff9900); 
                auraMat.emissive.setHex(0xff9900);
                houseShakeAmount = 0.02;
            } else {
                noiseBar.style.backgroundColor = "#10b981"; // Green
                noiseStatus.innerText = "Quiet - Peaceful Living";
                noiseStatus.style.color = "#10b981";
                auraMat.color.setHex(0x00ff00); 
                auraMat.emissive.setHex(0x00ff00);
                houseShakeAmount = 0;
            }

            // Aura opacity
            auraMat.opacity = Math.max(0.02, (currentNoise - 40) / 120);
        }

        wallCheck.addEventListener('change', updateSimulationState);
        treesCheck.addEventListener('change', updateSimulationState);
        speedCheck.addEventListener('change', updateSimulationState);

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });

        // --- 9. Animation Loop ---
        const clock = new THREE.Clock();
        
        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // Update Camera Controls
            controls.update();

            // Move Cars
            cars.forEach(car => {
                car.mesh.position.x += car.baseSpeed * speedMultiplier * car.direction;
                
                // Spin wheels
                car.mesh.children.forEach(child => {
                    if (child.geometry.type === 'CylinderGeometry') {
                        child.rotation.y += (car.baseSpeed * speedMultiplier) * (car.direction === 1 ? -1 : 1);
                    }
                });

                // Loop cars
                if (car.direction === 1 && car.mesh.position.x > 80) car.mesh.position.x = -80;
                if (car.direction === -1 && car.mesh.position.x < -80) car.mesh.position.x = 80;
            });

            // Animate Noise Aura (Breathing/Pulsing)
            const pulse = 1 + Math.sin(time * 3) * 0.05 * (currentNoise / 85);
            noiseAura.scale.set(pulse, pulse, pulse);
            noiseAura.rotation.y += 0.005;

            // Shake House based on noise
            if (houseShakeAmount > 0) {
                houseGroup.position.x = (Math.random() - 0.5) * houseShakeAmount;
                houseGroup.position.z = 18 + (Math.random() - 0.5) * houseShakeAmount;
            } else {
                houseGroup.position.x = 0;
                houseGroup.position.z = 18;
            }

            renderer.render(scene, camera);
        }

        // Initialize
        updateSimulationState();
        animate();

    </script>
</body>
</html>
